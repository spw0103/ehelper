<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail 邮件监控助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
  <div id="app">
    <!-- 登录区 -->
    <div id="login-section">
      <div class="login-card">
        <div class="logo"><span class="material-icons">mail</span></div>
        <h1>Gmail 邮件监控助手</h1>
        <p>登录后可扫描邮件、管理关键词并提取金额信息。</p>
        <button class="g-btn" id="login-btn">
          <span class="material-icons">account_circle</span> 使用 Google 账号登录
        </button>
        <div class="client-input">
          <label for="client-id">Google OAuth 客户端 ID（首次使用需填写）</label>
          <input type="text" id="client-id" placeholder="xxxxxx.apps.googleusercontent.com" autocomplete="off">
          <small>在 Google Cloud Console 创建 Web 应用 OAuth 2.0 客户端后填入。</small>
        </div>
      </div>
    </div>

    <!-- 主面板 -->
    <div id="dashboard">
      <div class="container">
        <header>
          <div class="brand">
            <span class="material-icons">mail</span>
            <h2>Gmail 邮件监控助手</h2>
          </div>
          <div class="user-box">
            <img id="user-avatar" alt="avatar">
            <span class="u-email" id="user-email"></span>
            <button class="logout-btn" id="logout-btn">
              <span class="material-icons">logout</span> 退出
            </button>
          </div>
        </header>

        <!-- 关键词管理 -->
        <div class="card">
          <h3><span class="material-icons">manage_search</span> 关键词管理</h3>
          <div class="kw-form">
            <input type="text" id="kw-input" placeholder="输入关键词，如：信用卡、还款、账单…" maxlength="50">
            <button class="btn btn-primary" id="kw-add">
              <span class="material-icons">add</span> 添加
            </button>
          </div>
          <div class="kw-list" id="kw-list"></div>
        </div>

        <!-- 扫描 -->
        <div class="card">
          <h3><span class="material-icons">search</span> 扫描邮件</h3>
          <div class="scan-filters">
            <div class="filter-row">
              <div class="filter-field">
                <label for="scan-from">发件人筛选（只扫描该发件人，留空为全部）</label>
                <input type="text" id="scan-from" placeholder="例如 alerts@bank.com 或 @bank.com" autocomplete="off">
              </div>
              <div class="filter-field">
                <label for="scan-exclude-from">排除发件人（多个用逗号分隔）</label>
                <input type="text" id="scan-exclude-from" placeholder="例如 ads@shop.com, noreply@xxx.com" autocomplete="off">
              </div>
            </div>
            <div class="filter-row">
              <div class="filter-field">
                <label for="scan-count">扫描数量</label>
                <select id="scan-count">
                  <option value="20" selected>最近 20 封</option>
                  <option value="50">最近 50 封</option>
                  <option value="100">最近 100 封</option>
                  <option value="200">最近 200 封</option>
                  <option value="500">最近 500 封</option>
                  <option value="all">全部邮件</option>
                </select>
              </div>
              <div class="filter-field">
                <label>排除无用类别</label>
                <div class="check-row">
                  <label class="check-item"><input type="checkbox" id="excl-promo"> 促销</label>
                  <label class="check-item"><input type="checkbox" id="excl-social"> 社交</label>
                  <label class="check-item"><input type="checkbox" id="excl-forums"> 论坛</label>
                  <label class="check-item"><input type="checkbox" id="excl-updates"> 通知</label>
                </div>
              </div>
            </div>
          </div>
          <div class="scan-bar">
            <button class="btn btn-primary" id="scan-btn">
              <span class="material-icons">play_arrow</span> 立即扫描
            </button>
            <div class="scan-progress" id="scan-progress"><div class="bar" id="scan-bar"></div></div>
            <span class="scan-status" id="scan-status"></span>
          </div>
          <div class="last-scan" id="last-scan" style="margin-top:12px"></div>
        </div>

        <!-- 结果 -->
        <div class="card">
          <h3 style="justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px"><span class="material-icons">receipt_long</span> 扫描记录</span>
            <button class="btn btn-danger-outline" id="clear-btn" style="padding:7px 14px;font-size:13px">
              <span class="material-icons">delete_sweep</span> 清空记录
            </button>
          </h3>
          <div class="record-count" id="record-count" style="margin-bottom:12px"></div>
          <div class="table-wrap">
            <table id="records-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>发件人</th>
                  <th>主题</th>
                  <th>匹配关键词</th>
                  <th>提取金额</th>
                </tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
          </div>
          <div class="no-records" id="no-records" style="display:none">暂无扫描记录，点击「立即扫描」开始监控。</div>
        </div>

        <div class="footer">数据仅存储在本地浏览器 localStorage，不会上传至任何服务器。</div>
      </div>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div id="overlay"><div class="spinner"></div><div class="msg" id="overlay-msg">正在扫描…</div></div>

  <!-- 通知 -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
