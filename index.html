<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail 邮件监控助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a73e8;
      --primary-dark: #1765cc;
      --bg: #f1f4f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #d93025;
      --success: #188038;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }

    /* ---------- 登录区 ---------- */
    #login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .login-card .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), #4285f4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      color: #fff;
    }
    .login-card .logo .material-icons { font-size: 40px; }
    .login-card h1 { font-size: 22px; margin-bottom: 8px; }
    .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

    .g-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      border-radius: 24px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      box-shadow: var(--shadow);
    }
    .g-btn:hover { background: var(--primary-dark); box-shadow: var(--shadow-lg); }
    .g-btn .material-icons { font-size: 20px; }
    .g-btn:disabled { opacity: .6; cursor: not-allowed; }

    .client-input {
      margin-top: 22px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }
    .client-input label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    .client-input input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .client-input input:focus { border-color: var(--primary); }
    .client-input small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .client-input .g-btn { margin-top: 12px; width: 100%; }

    /* ---------- 主面板 ---------- */
    #dashboard { display: none; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .material-icons { color: var(--primary); font-size: 30px; }
    .brand h2 { font-size: 18px; }
    .user-box { display: flex; align-items: center; gap: 12px; }
    .user-box img {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--border);
    }
    .user-box .u-email { font-size: 13px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .logout-btn:hover { color: var(--danger); border-color: var(--danger); }
    .logout-btn .material-icons { font-size: 17px; }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .card h3 .material-icons { color: var(--primary); font-size: 20px; }

    /* 关键词 */
    .kw-form { display: flex; gap: 10px; margin-bottom: 16px; }
    .kw-form input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .kw-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    .btn-outline:hover { background: #e8f0fe; }
    .btn-danger-outline { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger-outline:hover { background: #fce8e6; }
    .btn .material-icons { font-size: 18px; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .kw-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f0fe;
      color: var(--primary);
      border-radius: 16px;
      padding: 6px 8px 6px 14px;
      font-size: 13px;
      font-weight: 500;
    }
    .kw-chip button {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 50%;
      transition: background .15s;
    }
    .kw-chip button:hover { background: rgba(26,115,232,.15); }
    .kw-chip button .material-icons { font-size: 15px; }
    .empty-tip { color: var(--muted); font-size: 13px; }

    /* 扫描区 */
    .scan-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .scan-progress {
      flex: 1;
      min-width: 180px;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }
    .scan-progress .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #4285f4);
      border-radius: 4px;
      transition: width .3s;
    }
    .scan-status { font-size: 13px; color: var(--muted); }
    .last-scan { font-size: 13px; color: var(--muted); }

    /* 表格 */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 680px;
    }
    thead th {
      text-align: left;
      background: #f8fafc;
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:hover { background: #f8fafc; }
    td.subject { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.keywords .k-tag {
      display: inline-block;
      background: #e8f0fe;
      color: var(--primary);
      border-radius: 10px;
      padding: 2px 10px;
      font-size: 12px;
      margin: 2px 2px 2px 0;
    }
    td.amount { font-weight: 700; color: var(--success); white-space: nowrap; }
    td.amount.none { color: var(--muted); font-weight: 400; }
    td.date { white-space: nowrap; color: var(--muted); font-size: 13px; }
    .no-records {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 14px;
    }
    .record-count { font-size: 13px; color: var(--muted); }

    /* 通知 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #323232;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      opacity: 0;
      transition: all .3s ease;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.error { background: var(--danger); }
    #toast.success { background: var(--success); }

    /* 加载遮罩 */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #overlay.show { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay .msg { color: var(--muted); font-size: 14px; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 32px;
    }

    @media (max-width: 600px) {
      header { padding: 12px 14px; }
      .login-card { padding: 36px 24px; }
      .user-box .u-email { max-width: 120px; }
      .scan-bar { flex-direction: column; align-items: stretch; }
      .scan-progress { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 登录区 -->
    <div id="login-section">
      <div class="login-card">
        <div class="logo"><span class="material-icons">mail</span></div>
        <h1>Gmail 邮件监控助手</h1>
        <p>登录后可扫描邮件、管理关键词并提取金额信息。</p>
        <button class="g-btn" id="login-btn">
          <span class="material-icons">account_circle</span> 使用 Google 账号登录
        </button>
        <div class="client-input">
          <label for="client-id">Google OAuth 客户端 ID（首次使用需填写）</label>
          <input type="text" id="client-id" placeholder="xxxxxx.apps.googleusercontent.com" autocomplete="off">
          <small>在 Google Cloud Console 创建 Web 应用 OAuth 2.0 客户端后填入。</small>
        </div>
      </div>
    </div>

    <!-- 主面板 -->
    <div id="dashboard">
      <div class="container">
        <header>
          <div class="brand">
            <span class="material-icons">mail</span>
            <h2>Gmail 邮件监控助手</h2>
          </div>
          <div class="user-box">
            <img id="user-avatar" alt="avatar">
            <span class="u-email" id="user-email"></span>
            <button class="logout-btn" id="logout-btn">
              <span class="material-icons">logout</span> 退出
            </button>
          </div>
        </header>

        <!-- 关键词管理 -->
        <div class="card">
          <h3><span class="material-icons">manage_search</span> 关键词管理</h3>
          <div class="kw-form">
            <input type="text" id="kw-input" placeholder="输入关键词，如：信用卡、还款、账单…" maxlength="50">
            <button class="btn btn-primary" id="kw-add">
              <span class="material-icons">add</span> 添加
            </button>
          </div>
          <div class="kw-list" id="kw-list"></div>
        </div>

        <!-- 扫描 -->
        <div class="card">
          <h3><span class="material-icons">search</span> 扫描邮件</h3>
          <div class="scan-bar">
            <button class="btn btn-primary" id="scan-btn">
              <span class="material-icons">play_arrow</span> 立即扫描
            </button>
            <div class="scan-progress" id="scan-progress"><div class="bar" id="scan-bar"></div></div>
            <span class="scan-status" id="scan-status"></span>
          </div>
          <div class="last-scan" id="last-scan" style="margin-top:12px"></div>
        </div>

        <!-- 结果 -->
        <div class="card">
          <h3 style="justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px"><span class="material-icons">receipt_long</span> 扫描记录</span>
            <button class="btn btn-danger-outline" id="clear-btn" style="padding:7px 14px;font-size:13px">
              <span class="material-icons">delete_sweep</span> 清空记录
            </button>
          </h3>
          <div class="record-count" id="record-count" style="margin-bottom:12px"></div>
          <div class="table-wrap">
            <table id="records-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>发件人</th>
                  <th>主题</th>
                  <th>匹配关键词</th>
                  <th>提取金额</th>
                </tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
          </div>
          <div class="no-records" id="no-records" style="display:none">暂无扫描记录，点击「立即扫描」开始监控。</div>
        </div>

        <div class="footer">数据仅存储在本地浏览器 localStorage，不会上传至任何服务器。</div>
      </div>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div id="overlay"><div class="spinner"></div><div class="msg" id="overlay-msg">正在扫描…</div></div>

  <!-- 通知 -->
  <div id="toast"></div>

  <script>
    'use strict';

    const KEYS = { TOKEN: 'ehelper_access_token', EXPIRE: 'ehelper_expires_at', EMAIL: 'ehelper_user_email', NAME: 'ehelper_user_name', AVATAR: 'ehelper_avatar', KW: 'keywords', RECORDS: 'records', CID: 'ehelper_client_id' };
    const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.readonly';

    // ---------- 工具函数 ----------
    const $ = (id) => document.getElementById(id);
    let toastTimer = null;
    function toast(msg, type) {
      const el = $('toast');
      el.textContent = msg;
      el.className = type || '';
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function lsGet(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch (e) { return fallback; }
    }
    function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    function lsRemove(key) { localStorage.removeItem(key); }

    function getToken() { return localStorage.getItem(KEYS.TOKEN); }
    function getExpiresAt() { return parseInt(localStorage.getItem(KEYS.EXPIRE) || '0', 10); }
    function tokenValid() {
      return !!getToken() && getExpiresAt() > (Date.now() + 60000);
    }
    function clearToken() {
      lsRemove(KEYS.TOKEN); lsRemove(KEYS.EXPIRE);
    }

    function decodeBase64Url(b64) {
      if (!b64) return '';
      let s = b64.replace(/-/g, '+').replace(/_/g, '/');
      switch (s.length % 4) {
        case 0: break;
        case 2: s += '=='; break;
        case 3: s += '='; break;
        default: return '';
      }
      try { return decodeURIComponent(escape(atob(s))); }
      catch (e) {
        try { return atob(s); } catch (e2) { return ''; }
      }
    }

    function decodeHeader(value) {
      if (!value) return '';
      // RFC 2047 编码的标题（=?UTF-8?B?...?= 或 ?Q?...?=）
      const out = value.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, charset, enc, data) => {
        try {
          if (enc.toLowerCase() === 'b') {
            return decodeBase64Url(data);
          } else {
            return decodeURIComponent(data.replace(/_(?!\s)/g, '%20').replace(/=/g, '%'));
          }
        } catch (e) { return m; }
      });
      return out;
    }

    // ---------- 关键词 ----------
    function getKeywords() { return lsGet(KEYS.KW, []); }
    function setKeywords(list) { lsSet(KEYS.KW, list); }

    function renderKeywords() {
      const list = getKeywords();
      const wrap = $('kw-list');
      if (!list.length) {
        wrap.innerHTML = '<span class="empty-tip">尚未添加关键词，可添加如「信用卡」「还款」等。</span>';
        return;
      }
      wrap.innerHTML = '';
      list.forEach((kw, i) => {
        const chip = document.createElement('span');
        chip.className = 'kw-chip';
        chip.textContent = kw;
        const btn = document.createElement('button');
        btn.title = '删除';
        btn.innerHTML = '<span class="material-icons">close</span>';
        btn.addEventListener('click', () => {
          const arr = getKeywords();
          arr.splice(i, 1);
          setKeywords(arr);
          renderKeywords();
          toast('已删除关键词', 'success');
        });
        chip.appendChild(btn);
        wrap.appendChild(chip);
      });
    }

    function addKeyword() {
      const input = $('kw-input');
      const kw = input.value.trim();
      if (!kw) { toast('请输入关键词'); return; }
      const arr = getKeywords();
      if (arr.includes(kw)) { toast('该关键词已存在'); return; }
      arr.push(kw);
      setKeywords(arr);
      input.value = '';
      renderKeywords();
      toast('关键词已添加', 'success');
    }

    // ---------- 记录 ----------
    function getRecords() { return lsGet(KEYS.RECORDS, []); }
    function setRecords(list) { lsSet(KEYS.RECORDS, list); }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderRecords() {
      const records = getRecords().sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const body = $('records-body');
      $('record-count').textContent = records.length ? `共 ${records.length} 条记录（最近在上）` : '';
      $('no-records').style.display = records.length ? 'none' : 'block';
      body.innerHTML = '';
      records.forEach(r => {
        const tr = document.createElement('tr');
        const keywords = (r.keywords || []).map(k => `<span class="k-tag">${escapeHtml(k)}</span>`).join('');
        const hasAmount = r.amount != null && r.amount !== '';
        tr.innerHTML =
          `<td class="date">${escapeHtml(r.date || '')}</td>` +
          `<td title="${escapeHtml(r.from)}">${escapeHtml(r.from || '')}</td>` +
          `<td class="subject" title="${escapeHtml(r.subject)}">${escapeHtml(r.subject || '')}</td>` +
          `<td class="keywords">${keywords || '<span style="color:var(--muted)">-</span>'}</td>` +
          `<td class="amount${hasAmount ? '' : ' none'}">${escapeHtml(hasAmount ? r.amount : '未提取')}</td>`;
        body.appendChild(tr);
      });
    }

    // ---------- 邮件解析 ----------
    function getHeader(headers, name) {
      if (!headers) return '';
      const h = headers.find(x => x.name.toLowerCase() === name.toLowerCase());
      return h ? decodeHeader(h.value) : '';
    }

    function walkParts(part, found) {
      if (part.mimeType === 'text/plain') {
        found.text = decodeBase64Url(part.body && part.body.data);
        return;
      }
      if (part.mimeType === 'text/html' && found.text === '') {
        found.html = decodeBase64Url(part.body && part.body.data);
        return;
      }
      if (part.parts) {
        // 优先找 text/plain
        part.parts.forEach(p => {
          if (p.mimeType === 'text/plain' && found.text === '') found.text = decodeBase64Url(p.body && p.body.data);
        });
        part.parts.forEach(p => {
          if (p.mimeType === 'text/html' && found.html === '') found.html = decodeBase64Url(p.body && p.body.data);
        });
        part.parts.forEach(p => walkParts(p, found));
      }
    }

    function htmlToText(html) {
      return html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/(p|div|tr|li|h[1-6])>/gi, '\n')
        .replace(/<[^>]+>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&#39;|&apos;/gi, "'")
        .replace(/&quot;/gi, '"')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    // ---------- 金额提取 ----------
    const AMOUNT_PATTERNS = [
      /(?:金额|金額|还款|還款|还款金额|还贷|消費|消费|应付|應付|支付|账单|帳單)[：:]\s*[¥￥]?\s*([\d][\d,]*\.?\d*)/g,
      /[¥￥]\s*([\d][\d,]*\.?\d*)/g,
      /(?:due|amount|total|balance)[：: ]\s*[¥$￥]?\s*([\d][\d,]*\.?\d*)/gi
    ];

    function extractAmounts(text) {
      const amounts = [];
      const seen = new Set();
      const push = (v) => {
        if (!seen.has(v)) { seen.add(v); amounts.push(v); }
      };
      AMOUNT_PATTERNS.forEach(re => {
        let m;
        while ((m = re.exec(text)) !== null) push(m[1]);
      });
      return amounts;
    }

    function parseAmountValue(str) {
      return parseFloat(String(str).replace(/,/g, ''));
    }

    // ---------- 扫描 ----------
    async function apiFetch(url) {
      const res = await fetch(url, {
        headers: { Authorization: 'Bearer ' + getToken() }
      });
      if (res.status === 401) {
        throw new ApiError('登录已过期，请重新登录', true);
      }
      if (!res.ok) {
        let msg = '请求失败 (' + res.status + ')';
        try { const j = await res.json(); if (j && j.error && j.error.message) msg = j.error.message; } catch (e) {}
        throw new ApiError(msg, false);
      }
      return res.json();
    }

    class ApiError extends Error {
      constructor(msg, needsReauth) { super(msg); this.needsReauth = needsReauth; }
    }

    async function scanEmails() {
      const btn = $('scan-btn');
      const progress = $('scan-progress');
      const bar = $('scan-bar');
      const status = $('scan-status');

      if (!tokenValid()) { toast('登录已过期，请重新登录', 'error'); showLogin(); return; }

      const keywords = getKeywords();
      if (!keywords.length) { toast('请先添加至少一个关键词', 'error'); return; }

      btn.disabled = true;
      progress.style.display = 'block';
      bar.style.width = '0%';
      status.textContent = '正在获取邮件列表…';

      try {
        // 1. 获取最近 20 封邮件
        const list = await apiFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=20');
        const messages = list.messages || [];
        if (!messages.length) {
          status.textContent = '收件箱为空';
          $('last-scan').textContent = '上次扫描：' + new Date().toLocaleString('zh-CN') + '（收件箱无邮件）';
          return;
        }

        const newRecords = [];
        let done = 0;

        for (const m of messages) {
          // 2. 获取完整邮件内容
          const msg = await apiFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/' + m.id + '?format=full');
          done++;
          bar.style.width = Math.round((done / messages.length) * 100) + '%';
          status.textContent = `正在分析 ${done}/${messages.length} 封…`;

          const headers = msg.payload && msg.payload.headers;
          const from = getHeader(headers, 'From');
          const subject = getHeader(headers, 'Subject');
          const dateRaw = getHeader(headers, 'Date');
          const internalDate = msg.internalDate;

          const found = { text: '', html: '' };
          if (msg.payload) walkParts(msg.payload, found);
          let content = (found.text || htmlToText(found.html) || '').toLowerCase();
          const originalContent = found.text || htmlToText(found.html) || '';

          // 3. 关键词匹配
          const matched = keywords.filter(kw => {
            const needle = String(kw).toLowerCase();
            return content.includes(needle) || subject.toLowerCase().includes(needle);
          });

          if (!matched.length) continue;

          // 4. 提取金额
          const amounts = extractAmounts(originalContent);
          let displayAmount = '';
          if (amounts.length) {
            let best = amounts[0];
            let bestVal = parseAmountValue(best);
            amounts.forEach(a => {
              const v = parseAmountValue(a);
              if (v > bestVal) { best = a; bestVal = v; }
            });
            displayAmount = best;
          }

          newRecords.push({
            id: m.id,
            ts: internalDate ? parseInt(internalDate, 10) : Date.now(),
            date: internalDate ? new Date(parseInt(internalDate, 10)).toLocaleString('zh-CN') : new Date().toLocaleString('zh-CN'),
            from: from,
            subject: subject,
            keywords: matched,
            amount: displayAmount,
            scannedAt: Date.now()
          });
        }

        // 5. 去重合并
        const existing = getRecords();
        const existingIds = new Set(existing.map(r => r.id));
        const fresh = newRecords.filter(r => !existingIds.has(r.id));
        const merged = fresh.concat(existing);
        setRecords(merged);

        renderRecords();
        status.textContent = '';
        $('last-scan').textContent = '上次扫描：' + new Date().toLocaleString('zh-CN') +
          `（共扫描 ${messages.length} 封，新匹配 ${fresh.length} 条）`;
        toast(fresh.length ? `扫描完成，新增 ${fresh.length} 条记录` : '扫描完成，无新增匹配', fresh.length ? 'success' : '');
      } catch (err) {
        console.error(err);
        if (err.needsReauth) {
          toast('登录已过期，请重新登录', 'error');
          showLogin();
        } else {
          toast(err.message || '扫描失败，请重试', 'error');
        }
        status.textContent = '扫描失败';
      } finally {
        btn.disabled = false;
        progress.style.display = 'none';
        bar.style.width = '0%';
      }
    }

    // ---------- 登录 / 登出 ----------
    let gisClient = null;

    function showOverlay(msg) {
      $('overlay-msg').textContent = msg;
      $('overlay').classList.add('show');
    }
    function hideOverlay() { $('overlay').classList.remove('show'); }

    function getClientId() {
      return localStorage.getItem(KEYS.CID) || $('client-id').value.trim();
    }

    function initGis() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        toast('Google 登录库加载失败，请检查网络', 'error');
        return false;
      }
      const clientId = getClientId();
      if (!clientId) { toast('请先填写 Google OAuth 客户端 ID', 'error'); return false; }
      gisClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: GMAIL_SCOPE,
        callback: (resp) => {
          if (resp && resp.access_token) {
            localStorage.setItem(KEYS.TOKEN, resp.access_token);
            localStorage.setItem(KEYS.EXPIRE, String(Date.now() + (resp.expires_in || 3600) * 1000));
            const profile = resp.profile || {};
            if (profile.email) localStorage.setItem(KEYS.EMAIL, profile.email);
            if (profile.name) localStorage.setItem(KEYS.NAME, profile.name);
            if (profile.picture) localStorage.setItem(KEYS.AVATAR, profile.picture);
            showDashboard();
            toast('登录成功', 'success');
          } else {
            toast('授权失败：' + (resp.error || '未知错误'), 'error');
          }
        }
      });
      return true;
    }

    function login() {
      const clientId = getClientId();
      if (!clientId) { toast('请先填写 Google OAuth 客户端 ID', 'error'); return; }
      localStorage.setItem(KEYS.CID, clientId);
      if (!initGis()) return;
      gisClient.requestAccessToken();
    }

    function logout() {
      clearToken();
      lsRemove(KEYS.EMAIL); lsRemove(KEYS.NAME); lsRemove(KEYS.AVATAR);
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        try { google.accounts.id.disableAutoSelect(); } catch (e) {}
      }
      showLogin();
      toast('已退出登录');
    }

    function showLogin() {
      $('login-section').style.display = 'flex';
      $('dashboard').style.display = 'none';
      $('client-id').value = localStorage.getItem(KEYS.CID) || '';
    }

    function showDashboard() {
      $('login-section').style.display = 'none';
      $('dashboard').style.display = 'block';
      const email = localStorage.getItem(KEYS.EMAIL);
      const name = localStorage.getItem(KEYS.NAME);
      const avatar = localStorage.getItem(KEYS.AVATAR);
      if (email) {
        $('user-email').textContent = name ? `${name} · ${email}` : email;
        $('user-email').title = email;
      } else {
        $('user-email').textContent = '已登录';
      }
      if (avatar) { $('user-avatar').src = avatar; }
      renderKeywords();
      renderRecords();
      const last = getRecords().length ? getRecords().sort((a, b) => (a.scannedAt || 0) - (b.scannedAt || 0)).pop().scannedAt : null;
      if (last) $('last-scan').textContent = '上次扫描：' + new Date(last).toLocaleString('zh-CN');
    }

    // ---------- 初始化 ----------
    function init() {
      // 事件绑定
      $('login-btn').addEventListener('click', login);
      $('logout-btn').addEventListener('click', logout);
      $('kw-add').addEventListener('click', addKeyword);
      $('kw-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addKeyword(); });
      $('scan-btn').addEventListener('click', scanEmails);
      $('clear-btn').addEventListener('click', () => {
        if (getRecords().length && confirm('确定清空所有扫描记录吗？此操作不可恢复。')) {
          setRecords([]);
          renderRecords();
          toast('记录已清空');
        }
      });

      // 检查登录状态
      if (tokenValid()) {
        // 拉取用户信息
        (async () => {
          try {
            const info = await apiFetch('https://gmail.googleapis.com/gmail/v1/users/me/profile');
            if (info.emailAddress) {
              localStorage.setItem(KEYS.EMAIL, info.emailAddress);
              const parts = info.emailAddress.split('@');
              if (!localStorage.getItem(KEYS.NAME)) localStorage.setItem(KEYS.NAME, parts[0]);
            }
          } catch (e) {
            if (e.needsReauth) { showLogin(); return; }
          }
          showDashboard();
        })();
      } else {
        showLogin();
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
